name: build-kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Dependencias
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev lzop python3 git libc6:i386 libstdc++6:i386 zlib1g:i386
      - name: Clonar kernel y toolchain
        run: |
          git clone --depth 1 -b lineage-18.1 https://github.com/retiredtab/android_kernel_samsung_msm8916 kernel
          git clone --depth 1 https://github.com/burstlam/arm-eabi-4.9 toolchain
          $GITHUB_WORKSPACE/toolchain/bin/arm-eabi-gcc --version
      - name: Parches SM-P355M (BOE + alineacion)
        run: |
          python3 - <<'EOF'
          lds_path = "kernel/arch/arm/boot/compressed/vmlinux.lds.in"
          with open(lds_path, "r") as f:
              lds = f.read()
          assert ".piggydata : {" in lds
          lds = lds.replace(".piggydata : {", ". = ALIGN(4);\n  .piggydata : {", 1)
          with open(lds_path, "w") as f:
              f.write(lds)

          pan_path = "kernel/drivers/video/msm/mdss/samsung/S6D7AA0_LSL080AL03_BOE/ss_dsi_panel_S6D7AA0_LSL080AL03_BOE.c"
          with open(pan_path, "r") as f:
              pan = f.read()
          pan = pan.replace("ss_dsi_panel_S6D7AA0_LSL080AL03_BOE_WXGA", "ss_dsi_panel_LSL080AL03_BOE_WXGA")
          pan = pan.replace("vdd->support_cabc = true;", "vdd->support_cabc = false;")
          pan = pan.replace("vdd->support_mdnie_lite = true;", "vdd->support_mdnie_lite = false;")
          pan = pan.replace("vdd->panel_func.samsung_bl_ic_pwm_en(1);", "if (vdd->panel_func.samsung_bl_ic_pwm_en) vdd->panel_func.samsung_bl_ic_pwm_en(1);")
          pan = pan.replace("vdd->panel_func.samsung_bl_ic_pwm_en(0);", "if (vdd->panel_func.samsung_bl_ic_pwm_en) vdd->panel_func.samsung_bl_ic_pwm_en(0);")
          with open(pan_path, "w") as f:
              f.write(pan)

          vreg_path = "kernel/drivers/net/wireless/wcnss/wcnss_vreg.c"
          with open(vreg_path, "r") as f:
              vreg = f.read()
          old_v2 = """static struct vregs_info pronto_vregs_pronto_v2[] = {
\t{"qcom,pronto-vddmx",  VREG_NULL_CONFIG,
\t\tRPM_REGULATOR_CORNER_SUPER_TURBO,  0,
\t\tRPM_REGULATOR_CORNER_SUPER_TURBO, 0,    NULL},"""
          new_v2 = """static struct vregs_info pronto_vregs_pronto_v2[] = {
\t{"qcom,pronto-vddmx",  VREG_NULL_CONFIG,
\t\t1287500,  0,
\t\t1287500, 0,    NULL},"""
          assert old_v2 in vreg
          vreg = vreg.replace(old_v2, new_v2, 1)
          with open(vreg_path, "w") as f:
              f.write(vreg)
          EOF
          grep -n -C 2 'piggydata' kernel/arch/arm/boot/compressed/vmlinux.lds.in
          grep -nE 'panel_string|support_cabc|support_mdnie_lite|samsung_bl_ic_pwm_en' kernel/drivers/video/msm/mdss/samsung/S6D7AA0_LSL080AL03_BOE/ss_dsi_panel_S6D7AA0_LSL080AL03_BOE.c
          grep -n -A 5 'pronto_vregs_pronto_v2' kernel/drivers/net/wireless/wcnss/wcnss_vreg.c
      - name: Compilar
        run: |
          cd kernel
          export ARCH=arm
          export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-eabi-
          mkdir output
          make O=output HOSTCFLAGS="-fcommon" VARIANT_DEFCONFIG=msm8916_sec_gt58ltebmc_eur_defconfig msm8916_sec_defconfig SELINUX_DEFCONFIG=selinux_defconfig
          make O=output HOSTCFLAGS="-fcommon" -j$(nproc) zImage
          ls -l output/arch/arm/boot/
      - uses: actions/upload-artifact@v4
        with:
          name: zImage-p355m
          path: kernel/output/arch/arm/boot/zImage
